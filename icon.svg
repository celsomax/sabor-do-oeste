<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d3323"/>
      <stop offset="100%" style="stop-color:#132318"/>
    </linearGradient>
    <linearGradient id="salame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a33828"/>
      <stop offset="100%" style="stop-color:#7a2920"/>
    </linearGradient>
    <linearGradient id="tip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7a2920"/>
      <stop offset="100%" style="stop-color:#5d1f16"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Borda dourada suave -->
  <rect width="512" height="512" rx="110" fill="none" stroke="#e8d6ad" stroke-width="10" opacity="0.25"/>

  <!-- Círculo decorativo interno -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#e8d6ad" stroke-width="5" opacity="0.18"/>

  <!-- Linguiça - corpo central inclinado -->
  <g transform="rotate(-28, 256, 256)">
    <!-- Pontinha esquerda (arrematada) -->
    <ellipse cx="100" cy="256" rx="38" ry="62" fill="url(#tip)"/>
    <!-- Corpo da linguiça -->
    <rect x="100" y="194" width="312" height="124" rx="0" fill="url(#salame)"/>
    <!-- Pontinha direita (arrematada) -->
    <ellipse cx="412" cy="256" rx="38" ry="62" fill="url(#tip)"/>
    <!-- Brilho superior -->
    <ellipse cx="260" cy="213" rx="90" ry="14" fill="rgba(255,255,255,0.09)"/>
    <!-- Amarrado esquerdo -->
    <rect x="88" y="226" width="16" height="60" rx="8" fill="#e8d6ad" opacity="0.8"/>
    <!-- Amarrado direito -->
    <rect x="408" y="226" width="16" height="60" rx="8" fill="#e8d6ad" opacity="0.8"/>
    <!-- Fio esquerdo -->
    <line x1="96" y1="210" x2="96" y2="226" stroke="#e8d6ad" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="96" y1="286" x2="96" y2="302" stroke="#e8d6ad" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- Fio direito -->
    <line x1="416" y1="210" x2="416" y2="226" stroke="#e8d6ad" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="416" y1="286" x2="416" y2="302" stroke="#e8d6ad" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Texto Sabor do Oeste -->
  <text x="256" y="430" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="42" font-weight="bold"
        fill="#e8d6ad" opacity="0.92" letter-spacing="2">SABOR DO OESTE</text>
</svg>
